<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Biglietti Treno</title>
</head>
<body id="container">
    <!-- titolo -->
    <h1 id="title">CALCOLA IL TUO BIGLIETTO</h1>
    <form id="form" action="">
        <section>
            <!-- box per l'inserimento del nome -->
            <div class="form-label">
                <label for="name-field">Nome Cognome:</label>
                <input type="text" id="name-field" placeholder="Nome">
            </div>
            <!-- box per l'inserimento dei chilometri -->
            <div class="form-label">
                <label for="length-field">Km da percorrere:</label>
                <input type="number" id="length-field" placeholder="Chilometri">
            </div>
            <!-- box per la selezione della fascia d'età -->
            <div class="form-label">
                <label for="age-field">Fascia d'età:</label>
                <select id="age-field">
                    <option value="under18">Sotto i 18 anni</option>
                    <option value="adult">Tra i 18 e i 64 anni</option>
                    <option value="over65">Sopra i 65 anni</option>
                </select>
            </div>
        </section>
        <!-- bottone per invio dati -->
        <div class="form-buttons">
            <button class="form-button" type="submit" id="submit-field">Calcola</button>
            <button class="form-button" type="" id="submit-field">annulla</button>
        </div>
    </form>

    <!-- Sezione per mostrare i dati inseriti -->
    <div id="output">
        <h2>Dati Inseriti:</h2>
        <p><strong>Nome:</strong> <span id="name-output"></span></p>
        <p><strong>Chilometri:</strong> <span id="length-output"></span></p>
        <!-- <p><strong>Fascia d'età:</strong> <span id="age-output"></span></p> -->
        <p><strong>Prezzo Totale:</strong> €<span id="price-output"></span></p>
        <p><strong>Offerta:</strong> <span id="offer-output"></span></p>
        <p><strong>Carrozza:</strong> <span id="carriage-output"></span></p>
        <p><strong>Codice CP:</strong> <span id="cp-output"></span></p>
    </div>

    <script src="./script.js"></script>
</body>
</html>
